[package]
name = "nago-img-converter"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "nago_img_converter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nago-img-converter"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri              = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs    = "2"

serde        = { version = "1", features = ["derive"] }
serde_json   = "1"

image        = { version = "0.25", default-features = false, features = [
    "png", "jpeg", "gif", "bmp", "webp"
] }
webp         = "0.3"

rayon        = "1"
thiserror    = "2"
log          = "0.4"

[profile.dev]
incremental = true

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
