name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (Windows portable)
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles none

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: NagoImgConverter-windows-portable
          path: src-tauri/target/x86_64-pc-windows-msvc/release/nago-img-converter.exe
          if-no-files-found: error
          retention-days: 14
